<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Father's Day Blueprint</title>
    <style>
        /* Base Layout & Alignment Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0b3c5d; 
            /* Engineered blueprint grid pattern */
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Courier New', Courier, monospace; 
            color: #fff; 
            overflow: hidden; 
            transition: background 0.5s ease;
        }

        /* BLUEPRINT SLIDING DOORS (The Entrance Cover) */
        #blueprint-gate { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 1000; 
            display: flex; 
        }
        .pane { 
            flex: 1; 
            height: 100%; 
            background: #1d5f8a; 
            border: 4px dashed rgba(255,255,255,0.3);
            background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); 
        }
        .pane-left { transform-origin: left; border-right: 2px solid #fff; }
        .pane-right { transform-origin: right; border-left: 2px solid #fff; }
        
        /* Sliding out classes triggered by JS */
        .open .pane-left { transform: translateX(-100%); }
        .open .pane-right { transform: translateX(100%); }
        
        #open-btn { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 18px 36px; 
            background: #328cc1; 
            color: white;
            border: 2px solid #fff; 
            border-radius: 4px; 
            cursor: pointer; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 1.2em; 
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            z-index: 1001; 
            letter-spacing: 2px;
            transition: background 0.3s;
        }
        #open-btn:hover { background: #0b3c5d; }

        /* FLOATING ENGINEER PARTICLES */
        .particle { position: absolute; pointer-events: none; animation: floatUp 6s linear forwards; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        /* MAIN REVEAL SHEET DISPLAY */
        .display-container { 
            display: none; 
            opacity: 0; 
            width: 90%; 
            max-width: 460px; 
            background: rgba(7, 38, 59, 0.95); 
            border: 3px solid #328cc1; 
            border-radius: 12px; 
            padding: 30px; 
            text-align: center; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); 
            z-index: 10; 
            transition: opacity 0.8s ease-in-out; 
            position: relative;
        }

        /* STAMP EXTENSION */
        .tech-stamp {
            position: absolute; top: 12px; right: 15px;
            border: 1px dashed #d9b310; color: #d9b310;
            padding: 2px 6px; font-size: 0.65em; font-weight: bold;
            transform: rotate(3deg); border-radius: 3px; opacity: 0.8;
        }
        
        img#dad-photo { 
            width: 100%; 
            max-height: 200px; 
            object-fit: contain; 
            border-radius: 8px; 
            border: 2px dashed #328cc1; 
            margin-bottom: 10px; 
        }

        /* LIVE LIVE COUNTER DESIGN */
        .live-counter {
            font-size: 0.75em; color: #328cc1;
            margin-bottom: 10px; letter-spacing: 1px; font-weight: bold;
        }
        
        h1 { color: #d9b310; font-size: 1.6em; margin: 5px 0 10px 0; letter-spacing: 1px; }
        
        /* DAD METRICS CORE PARAMETERS */
        .metrics-board {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            font-size: 0.85em; 
            margin: 15px 0; 
            border: 1px dashed #328cc1; 
            padding: 10px; 
            border-radius: 6px; 
            background: rgba(0,0,0,0.3);
            text-align: left;
        }
        
        /* TERMINAL MESSAGE LOG COMPONENT */
        .message-box { 
            min-height: 105px; 
            margin: 15px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: rgba(255,255,255,0.05); 
            padding: 12px; 
            border-radius: 6px;
            border-left: 3px solid #d9b310;
        }
        
        #changing-text { 
            font-style: italic; 
            line-height: 1.6; 
            font-size: 1.05em; 
            color: #fff; 
            margin: 0; 
            transition: opacity 0.2s ease-in-out; 
        }

        /* INTERACTIVE LOG CONTROL BUTTONS */
        .terminal-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
        .terminal-buttons button { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.8em; 
            padding: 8px 12px; 
            background: #328cc1; 
            color: white; 
            border: 1px solid white; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        .terminal-buttons button:hover { background: #1d5f8a; }
        .terminal-buttons button:active { transform: scale(0.95); }

        /* AUX BUTTON PANEL AT BOTTOM */
        .control-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 25px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" preload="auto"></audio>

    <div id="blueprint-gate">
        <div class="pane pane-left"></div>
        <div class="pane pane-right"></div>
        <button id="open-btn" onclick="unrollBlueprint()">INITIALIZE BLUEPRINT 🛠️</button>
    </div>

    <div class="display-container" id="reveal-card">
        <div class="tech-stamp">SYS_VER: 1.0_APPROVED</div>

        <img src="dad.jpg" alt="Best Dad Ever" id="dad-photo">
        
        <div class="live-counter">TOTAL HOURS OF BEST ADVICE: <span id="odometer">0</span> HR</div>

        <h1>HAPPY FATHER'S DAY!</h1>
        
        <div class="metrics-board">
            <div>🛠️ PATIENCE: 100%</div>
            <div>☕ COFFEE: OPTIMAL</div>
            <div>🧠 WISDOM: INFINITE</div>
            <div>❤️ JOKES: CRITICAL</div>
        </div>
        
        <div class="message-box">
            <p id="changing-text">Select a schematic module below to read terminal logs...</p>
        </div>

        <div class="terminal-buttons">
            <button onclick="selectSpec(0)">[FOUNDATION]</button>
            <button onclick="selectSpec(1)">[LOGIC]</button>
            <button onclick="selectSpec(2)">[MECHANICS]</button>
        </div>

        <div class="control-footer">
            <button onclick="systemOverride()" style="padding: 5px 10px; background: #cc2511; color: white; border: 1px dashed white; border-radius: 4px; font-family: 'Courier New'; font-size: 0.7em; cursor: pointer; font-weight: bold;">⚠️ SYSTEM OVERRIDE</button>
            <button id="audio-toggle" onclick="toggleMute()" style="padding: 5px 10px; background: transparent; color: #328cc1; border: 1px solid #328cc1; border-radius: 4px; font-family: 'Courier New'; font-size: 0.7em; cursor: pointer;">🔊 AUDIO: ON</button>
        </div>
    </div>

    <script>
        const dadSayings = [
            "FOUNDATION LOG: To the man who built the structural framework of our family. Your support is our perfect constant. 📐",
            "LOGIC LOG: Thank you for teaching me to look at problems logically, debug my failures, and always analyze to find a solution. 🛠️",
            "MECHANICS LOG: Happy Father's Day to my favorite engineer! You are structurally, mechanically, and completely irreplaceable. ⚡"
        ];

        let soundEnabled = true;

        function unrollBlueprint() {
            document.getElementById('blueprint-gate').classList.add('open');
            
            setTimeout(() => {
                document.getElementById('blueprint-gate').style.display = 'none';
                const card = document.getElementById('reveal-card');
                card.style.display = 'block';
                
                setTimeout(() => {
                    card.style.opacity = '1';
                    setInterval(spawnParticles, 350);
                    runOdometer(); // Start counting data upward
                }, 50);
            }, 1500);
        }

        // Live updating odometer counting system
        function runOdometer() {
            const countTarget = 999999;
            const element = document.getElementById('odometer');
            let current = 0;
            const step = Math.ceil(countTarget / 60); // Speed up counting steps
            
            let timer = setInterval(() => {
                current += step;
                if (current >= countTarget) {
                    element.innerText = countTarget.toLocaleString();
                    clearInterval(timer);
                } else {
                    element.innerText = current.toLocaleString();
                }
            }, 25);
        }

        // Play or suppress mechanical beep
        function playBeep() {
            if (!soundEnabled) return;
            const sound = document.getElementById('click-sound');
            if (sound) { sound.currentTime = 0; sound.play().catch(e => {}); }
        }

        // System Settings Audio Handler
        function toggleMute() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('audio-toggle');
            btn.innerText = soundEnabled ? "🔊 AUDIO: ON" : "🔇 AUDIO: MUTED";
            if (soundEnabled) playBeep();
        }

        function selectSpec(index) {
            const textElement = document.getElementById('changing-text');
            playBeep();
            
            textElement.style.opacity = 0;
            
            setTimeout(() => {
                textElement.innerText = "RUNNING DIAGNOSTICS... DECRYPTING LOG FILE...";
                textElement.style.opacity = 0.4;
                
                setTimeout(() => {
                    textElement.innerText = dadSayings[index];
                    textElement.style.opacity = 1;
                }, 600);
            }, 200);
        }

        function systemOverride() {
            playBeep();
            document.body.style.backgroundColor = "#5a0f0f";
            document.body.style.backgroundImage = "linear-gradient(rgba(255,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,0,0,0.1) 1px, transparent 1px)";
            
            let panicInterval = setInterval(spawnParticles, 40);
            
            setTimeout(() => {
                alert("🚨 CRITICAL ERROR DETECTED:\n\nFather's Day love parameters have exceeded maximum safety levels! Core thermal matrix melting! ❤️🔥");
                clearInterval(panicInterval);
                
                document.body.style.backgroundColor = "#0b3c5d";
                document.body.style.backgroundImage = "linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px)";
            }, 1000);
        }

        function spawnParticles() {
            const symbols = ['⚙️', '⭐', '👍', '📐', '🔧', '✨'];
            const p = document.createElement('div');
            p.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-50px';
            p.style.fontSize = (Math.random() * 15 + 20) + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            p.style.opacity = Math.random();
            document.body.appendChild(p);
            
            setTimeout(() => p.remove(), 6000);
        }
    </script>
</body>
</html>
