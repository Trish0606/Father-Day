<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Father's Day Command Console v3.0</title>
    <style>
        /* Reset and Cyber-Grid Infrastructure */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #020b14; 
            background-image: linear-gradient(rgba(0, 150, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 150, 255, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Courier New', Courier, monospace; 
            color: #00aaff; overflow: hidden; 
            transition: background 0.5s ease;
        }

        /* INITIAL OVERLAY: MATRIX INTERACTIVE SHUTTER */
        #blueprint-gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: flex; 
        }
        .pane { 
            flex: 1; height: 100%; background: #041624; border: 3px solid rgba(0, 170, 255, 0.2);
            background-image: linear-gradient(rgba(0, 170, 255, 0.02) 2px, transparent 2px),
                              linear-gradient(90deg, rgba(0, 170, 255, 0.02) 2px, transparent 2px);
            background-size: 60px 60px;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1); 
        }
        .pane-left { transform-origin: left; border-right: 2px solid #00aaff; }
        .pane-right { transform-origin: right; border-left: 2px solid #00aaff; }
        .open .pane-left { transform: translateX(-100%); }
        .open .pane-right { transform: translateX(100%); }
        
        #open-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 22px 45px; background: #003366; color: #fff;
            border: 2px solid #00aaff; border-radius: 4px; cursor: pointer; 
            font-family: 'Courier New', monospace; font-size: 1.2em; font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.6); z-index: 1001; letter-spacing: 3px;
        }
        #open-btn:hover { background: #005599; box-shadow: 0 0 45px #00aaff; }

        /* BOOT DISPLAY BOARDS */
        #boot-screen {
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: #020b14; z-index: 999; display: none; padding: 40px;
            text-align: left; font-size: 0.9em; color: #33ff33; overflow: hidden;
        }

        /* HARDWARE FLOATING SYMBOLS */
        .particle { position: absolute; pointer-events: none; animation: floatUp 5s linear forwards; color: rgba(0, 170, 255, 0.3); font-weight: bold; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        /* TACTICAL HUD CONSOLE FRAME */
        .hud-container { 
            display: none; opacity: 0; width: 95%; max-width: 1050px; 
            background: rgba(3, 15, 27, 0.96); border: 2px solid #0066aa; 
            border-radius: 6px; padding: 25px; box-shadow: 0 0 50px rgba(0,0,0,0.9);
            z-index: 10; transition: opacity 0.6s ease-in-out; position: relative;
