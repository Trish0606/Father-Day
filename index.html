<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Father's Day Command Console</title>
    <style>
        /* Base Reset & Cyberpunk/Blueprint Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #051625; 
            background-image: linear-gradient(rgba(50, 140, 193, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(50, 140, 193, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
            height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Courier New', Courier, monospace; 
            color: #50b4f0; overflow: hidden; 
            transition: background 0.5s ease;
        }

        /* INITIAL COVER: SLIDING TECH GATES */
        #blueprint-gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: flex; 
        }
        .pane { 
            flex: 1; height: 100%; background: #0b3c5d; border: 4px dashed rgba(80, 180, 240, 0.3);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); 
        }
        .pane-left { transform-origin: left; border-right: 2px solid #50b4f0; }
        .pane-right { transform-origin: right; border-left: 2px solid #50b4f0; }
        .open .pane-left { transform: translateX(-100%); }
        .open .pane-right { transform: translateX(100%); }
        
        #open-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 20px 40px; background: #1d5f8a; color: #fff;
            border: 2px solid #50b4f0; border-radius: 4px; cursor: pointer; 
            font-family: 'Courier New', monospace; font-size: 1.2em; font-weight: bold;
            box-shadow: 0 0 20px rgba(50, 140, 193, 0.5); z-index: 1001; letter-spacing: 2px;
        }

        /* FLOATING BACKGROUND PARTICLES */
        .particle { position: absolute; pointer-events: none; animation: floatUp 6s linear forwards; color: rgba(80, 180, 240, 0.4); }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
