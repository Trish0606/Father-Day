<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Father's Day Blueprint</title>
    <style>
        /* 1. BLUEPRINT BACKGROUND & BASE STYLING */
        body { 
            background-color: #0b3c5d; 
            /* Creates a real engineering grid paper look using CSS */
            background-image: max(1vw, 1vh) linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
                              max(1vw, 1vh) linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh; margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Courier New', Courier, monospace; /* Technical, typewriter font */
            color: #fff; overflow: hidden; 
        }

        /* 2. BLUEPRINT SLIDING DOORS (The Entrance) */
        #blueprint-gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1000; display: flex; transition: opacity 1s; 
        }
        .pane { 
            flex: 1; height: 100%; background: #1d5f8a; 
            border: 4px dashed rgba(255,255,255,0.3);
            /* Grid overlay inside the doors */
            background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); 
            display: flex; justify-content: center; align-items: center;
        }
        .pane-left { transform-origin: left; border-right: 2px solid #fff; }
        .pane-right { transform-origin: right; border-left: 2px solid #fff; }
        
        /* Slide away animation */
        .open .pane-left { transform: translateX(-100%); }
        .open .pane-right { transform: translateX(100%); }
        
        #open-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 18px 36px; background: #328cc1; color: white;
            border: 2px solid #fff; border-radius: 4px; cursor: pointer; 
            font-family: 'Courier New', Courier, monospace; font-size: 1.2em; font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 1001; 
            letter-spacing: 2px; transition: background 0.3s;
        }
        #open-btn:hover { background: #0b3c5d; }

        /* 3. FLOATING PARTICLES (Gears, Stars, Thumbs Up) */
        .particle { position: absolute; pointer-events: none; animation: floatUp 6s linear forwards; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        /* 4. MAIN DISPLAY CARD */
        .display-container { 
            display: none; opacity: 0; width: 90%; max-width: 450px; 
            background: rgba(11, 60, 93, 0.9); border: 3px solid #328cc1; 
            border-radius: 12px; padding: 35px; box-sizing: border-box; 
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); 
            z-index: 10; transition: opacity 1s ease-in-out; 
        }
        
        img#dad-photo { 
            width: 100%; max-height: 220px; object-fit: contain; 
            border-radius: 8px; border: 2px dashed #328cc1; margin-bottom: 20px; 
        }
        
        h1 { color: #d9b310; font-size: 1.8em; margin: 10px 0; letter-spacing: 1px; }
        
        /* POEM / SAYING CONTAINER */
        .message-box { 
            min-height: 100px; margin: 20px 0; display: flex; 
            align-items: center; justify-content: center; 
        }
        
        #changing-text { 
            font-style: italic; line-height: 1.6; font-size: 1.1em; 
            color: #fff; transition: opacity 0.5s ease-in-out; 
        }
    </style>
</head>
<body>

    <div id="blueprint-gate">
        <div class="pane pane-left"></div>
        <div class="pane pane-right"></div>
        <button id="open-btn" onclick="unrollBlueprint()">INITIALIZE BLUEPRINT 🛠️</button>
    </div>

    <div class="display-container" id="reveal-card">
        <img src="dad.jpg" alt="Best Dad Ever" id="dad-photo">
        <h1>HAPPY FATHER'S DAY!</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85em; margin: 15px 0; border: 1px dashed #328cc1; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.2);">
    <div>🛠️ PATIENCE: 100%</div>
    <div>☕ COFFEE LEVEL: OPTIMAL</div>
    <div>🧠 WISDOM: INFINITE</div>
    <div>❤️ DAD JOKE FREQUENCY: CRITICAL</div>
</div>
        <div class="message-box">
            <p id="changing-text">Loading schematics of an awesome dad...</p>
        </div>
    </div>

    <script>
        // Array of different engineering puns, poems, and sayings for him
        const dadSayings = [
            "To the man who can engineer a solution to any problem, and who built the foundation of our family. 📐",
            "Dad: The ultimate project manager, structural backbone, and heart of our home.",
            "Thank you for teaching me that if things aren't working right, you just need to analyze, adjust, and try again. 🛠️",
            "No matter how complex life gets, your love and guidance are the perfect constants in my equation.",
            "Happy Father's Day to my favorite engineer! You are structurally, mechanically, and completely irreplaceable. ⚡"
        ];
        
        let sayingIndex = 0;

        function unrollBlueprint() {
            // 1. Slide open the blueprint panes
            document.getElementById('blueprint-gate').classList.add('open');
            
            // 2. Clear the gate away and bring up the card
            setTimeout(() => {
                document.getElementById('blueprint-gate').style.display = 'none';
                const card = document.getElementById('reveal-card');
                card.style.display = 'block';
                
                setTimeout(() => {
                    card.style.opacity = '1';
                    // Start generating the floating engine items
                    setInterval(spawnParticles, 350);
                    // Start rotating through the sayings
                    rotateSayings();
                    setInterval(rotateSayings, 5000); // Changes text every 5 seconds
                }, 50);
            }, 1500);
        }

        // Handles the fading out and changing of sayings text
        function rotateSayings() {
            const textElement = document.getElementById('changing-text');
            textElement.style.opacity = 0; // Fade out current text
            
            setTimeout(() => {
                textElement.innerText = dadSayings[sayingIndex];
                textElement.style.opacity = 1; // Fade in new text
                sayingIndex = (sayingIndex + 1) % dadSayings.length; // Loop back to start
            }, 500);
        }

        // Spawns technical emojis floating upwards
        function spawnParticles() {
            const symbols = ['⚙️', '⭐', '👍', '📐', '🔧', '✨'];
            const p = document.createElement('div');
            p.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-50px';
            p.style.fontSize = (Math.random() * 15 + 20) + 'px'; // Random sizes
            p.style.animationDuration = (Math.random() * 3 + 4) + 's'; // Random speeds
            p.style.opacity = Math.random();
            document.body.appendChild(p);
            
            setTimeout(() => p.remove(), 6000);
        }
    </script>
</body>
</html>
