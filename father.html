<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Father's Day Blueprint</title>
    <style>
        /* 1. FIXED BLUEPRINT BACKGROUND & BASE STYLING */
        body { 
            background-color: #0b3c5d; 
            /* FIXED: Standardized CSS linear-gradient grid mapping */
            background-image: linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh; margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Courier New', Courier, monospace; 
            color: #fff; overflow: hidden; 
        }

        /* 2. BLUEPRINT SLIDING DOORS (The Entrance) */
        #blueprint-gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1000; display: flex; transition: opacity 1s; 
        }
        .pane { 
            flex: 1; height: 100%; background: #1d5f8a; 
            border: 4px dashed rgba(255,255,255,0.3);
            background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1); 
        }
        .pane-left { transform-origin: left; border-right: 2px solid #fff; }
        .pane-right { transform-origin: right; border-left: 2px solid #fff; }
        
        .open .pane-left { transform: translateX(-100%); }
        .open .pane-right { transform: translateX(100%); }
        
        #open-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 18px 36px; background: #328cc1; color: white;
            border: 2px solid #fff; border-radius: 4px; cursor: pointer; 
            font-family: 'Courier New', Courier, monospace; font-size: 1.2em; font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 1001; 
            letter-spacing: 2px; transition: background 0.3s;
        }
        #open-btn:hover { background: #0b3c5d; }

        /* 3. FLOATING PARTICLES (Gears, Stars, Thumbs Up) */
        .particle { position: absolute; pointer-events: none; animation: floatUp 6s linear forwards; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        /* 4. MAIN DISPLAY CARD */
        .display-container { 
            display: none; opacity: 0; width: 90%; max-width: 450px; 
            background: rgba(11, 60, 93, 0.95); border: 3px solid #328cc1; 
            border-radius: 12px; padding: 30px; box-sizing: border-box; 
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); 
            z-index: 10; transition: opacity 1s ease-in-out; 
        }
        
        img#dad-photo { 
            width: 100%; max-height: 200px; object-fit: contain; 
            border-radius: 8px; border: 2px dashed #328cc1; margin-bottom: 15px; 
        }
        
        h1 { color: #d9b310; font-size: 1.6em; margin: 10px 0; letter-spacing: 1px; }
        
        /* DAD METRICS BOARD */
        .metrics-board {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            font-size: 0.85em; margin: 15px 0; border: 1px dashed #328cc1; 
            padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.3);
            text-align: left;
        }
        
        /* POEM / SAYING CONTAINER */
        .message-box { 
            min-height: 90px; margin: 15px 0; display: flex; 
            align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px;
        }
        
        #changing-text { 
            font-style: italic; line-height: 1.6; font-size: 1.05em; 
            color: #fff; margin: 0; transition: opacity 0.3s ease-in-out; 
        }

        /* INTERACTIVE MODULE BUTTONS */
        .terminal-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
        .terminal-buttons button { 
            font-family: 'Courier New', Courier, monospace; font-size: 0.8em; 
            padding: 8px 12px; background: #328cc1; color: white; border: 1px solid white; 
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .terminal-buttons button:hover { background: #0b3c5d; }
    </style>
</head>
<body>

    <div id="blueprint-gate">
        <div class="pane pane-left"></div>
        <div class="pane pane-right"></div>
        <button id="open-btn" onclick="unrollBlueprint()">INITIALIZE BLUEPRINT 🛠️</button>
    </div>

    <div class="display-container" id="reveal-card">
        <img src="dad.jpg" alt="Best Dad Ever" id="dad-photo">
        <h1>HAPPY FATHER'S DAY!</h1>
        
        <div class="metrics-board">
            <div>🛠️ PATIENCE: 100%</div>
            <div>☕ COFFEE: OPTIMAL</div>
            <div>🧠 WISDOM: INFINITE</div>
            <div>❤️ JOKES: CRITICAL</div>
        </div>
        
        <div class="message-box">
            <p id="changing-text">Select a schematic module below to read terminal logs...</p>
        </div>

        <div class="terminal-buttons">
            <button onclick="selectSpec(0)">[FOUNDATION]</button>
            <button onclick="selectSpec(1)">[LOGIC]</button>
            <button onclick="selectSpec(2)">[MECHANICS]</button>
        </div>
    </div>

    <script>
        // Highly targeted logs/poems for an engineer dad
        const dadSayings = [
            "FOUNDATION LOG: To the man who built the structural framework of our family. Your support is our perfect constant. 📐",
            "LOGIC LOG: Thank you for teaching me to look at problems logically, debug my failures, and always try again. 🛠️",
            "MECHANICS LOG: Happy Father's Day to my favorite engineer! You are structurally, mechanically, and completely irreplaceable. ⚡"
        ];

        function unrollBlueprint() {
            document.getElementById('blueprint-gate').classList.add('open');
            
            setTimeout(() => {
                document.getElementById('blueprint-gate').style.display = 'none';
                const card = document.getElementById('reveal-card');
                card.style.display = 'block';
                
                setTimeout(() => {
                    card.style.opacity = '1';
                    setInterval(spawnParticles, 350);
                }, 50);
            }, 1500);
        }

        // Handles user selecting different custom data blocks
        function selectSpec(index) {
            const textElement = document.getElementById('changing-text');
            textElement.style.opacity = 0;
            
            setTimeout(() => {
                textElement.innerText = dadSayings[index];
                textElement.style.opacity = 1;
            }, 300);
        }

        function spawnParticles() {
            const symbols = ['⚙️', '⭐', '👍', '📐', '🔧', '✨'];
            const p = document.createElement('div');
            p.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-50px';
            p.style.fontSize = (Math.random() * 15 + 20) + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            p.style.opacity = Math.random();
            document.body.appendChild(p);
            
            setTimeout(() => p.remove(), 6000);
        }
    </script>
</body>
</html>
